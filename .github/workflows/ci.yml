name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'
      - name: Locked dependencies
        run: npm ci --cache .forge/local/npm-cache --no-audit --no-fund
      - name: Typecheck
        run: bun run typecheck
      - name: Unit and native-runtime tests (loopback mocks)
        run: bun test
      - name: Install the fixed host locally
        run: npm install --prefix .forge/local/host --no-package-lock --cache .forge/local/npm-cache --no-audit --no-fund @opencode/cli@2.0.26
      - name: Pack, install and smoke the release artifact
        shell: pwsh
        run: |
          $env:OPENCODE_CLI = Join-Path $PWD '.forge/local/host/node_modules/@opencode/cli/bin/opencode.exe'
          bun run smoke:package
      - name: Retain only the verified package (no sandbox logs or credentials)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: npm-package
          path: |
            .forge/local/package/*.tgz
            .forge/local/package/SHA256SUMS
            .forge/local/package/pack.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Download the verified artifact (no publication)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: npm-package
          path: .forge/local/artifact-roundtrip
      - name: Require byte-identical artifact round-trip
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = @("opencode2-cliproxyapi-provider-$version.tgz", 'SHA256SUMS', 'pack.json')
          $actual = @(Get-ChildItem .forge/local/artifact-roundtrip -File | ForEach-Object Name)
          if (@(Compare-Object ($expected | Sort-Object) ($actual | Sort-Object)).Count -ne 0) { throw 'Unexpected downloaded artifact files' }
          foreach ($name in $expected) {
            $before = (Get-FileHash (Join-Path '.forge/local/package' $name) -Algorithm SHA256).Hash
            $after = (Get-FileHash (Join-Path '.forge/local/artifact-roundtrip' $name) -Algorithm SHA256).Hash
            if ($before -cne $after) { throw "Artifact round-trip differs: $name" }
          }
          Write-Output 'PASS verified artifact upload/download round-trip: identical package, checksum and metadata'
