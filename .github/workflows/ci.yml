name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.10'
      - name: Locked dependencies
        run: npm ci --cache .forge/local/npm-cache --no-audit --no-fund
      - name: Typecheck
        run: bun run typecheck
      - name: Unit and native-runtime tests (loopback mocks)
        run: bun test
      - name: Install the fixed host locally
        run: npm install --prefix .forge/local/host --no-package-lock --cache .forge/local/npm-cache --no-audit --no-fund @opencode/cli@2.0.26
      - name: Pack, install and smoke the release artifact
        shell: pwsh
        run: |
          $env:OPENCODE_CLI = Join-Path $PWD '.forge/local/host/node_modules/@opencode/cli/bin/opencode.exe'
          bun run smoke:package
      - name: Retain only the verified package (no sandbox logs or credentials)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: |
            .forge/local/package/*.tgz
            .forge/local/package/SHA256SUMS
            .forge/local/package/pack.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
